<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenCut</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    /* Some vez até o Vue montar (bundle baixando + validação de tenant) a
       tela ficava em branco puro — parecia travado. Esse spinner estático
       (puro HTML/CSS, sem depender de JS ter rodado) some sozinho assim que
       o #app é substituído pelo conteúdo real do Vue. */
    #app-boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F6F7FB;
      z-index: 9999;
    }

    #app-boot-loader .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid rgba(13, 27, 42, 0.12);
      border-top-color: #0D1B2A;
      animation: app-boot-spin 0.8s linear infinite;
    }

    @keyframes app-boot-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="app-boot-loader">
      <div class="spinner"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
